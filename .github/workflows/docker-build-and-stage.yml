name: Build and Stage

on:
  push:
    branches:
      - stage

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mmxniloy/cross-wave-language-app-server:stage
          build-args: |
            ARG_API_BASE_URL=${{ secrets.API_BASE_URL }}
            ARG_API_VERSION=${{ secrets.API_VERSION }}
            ARG_PROD_URL=${{ secrets.PROD_URL }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.SSH_SUDO_PASSWORD }}" | sudo -S ~/cw-restage.sh
